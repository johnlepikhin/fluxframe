[package]
name = "fluxframe-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GTK4/libadwaita GUI client for the FluxFrame control socket."

[dependencies]
fluxframe-core = { workspace = true }
# GTK stack — keep these out of workspace.dependencies because the
# `package = "..."` rename does not play well with workspace
# inheritance. Version + features must match the daemon-shared
# workspace pin (kept in sync by hand).
relm4 = { version = "0.10", default-features = false, features = ["macros", "libadwaita", "gnome_48"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6", "gtk_v4_18"] }
# Embedded preview pulls RGBA samples through `appsink` from a local
# `v4l2src device=/dev/video10` pipeline and paints them into a
# `gtk::Picture` via `gdk::MemoryTexture`. Pinned to the same minor
# as `fluxframe-gst` so the workspace has one set of GStreamer ABIs.
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-video = { workspace = true }
glib = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Used by `persistence` tests to isolate XDG_CONFIG_HOME per test in
# unique scratch dirs. Pinned to the same major as `fluxframe-effects`
# / `fluxframe-cli`; not promoted to workspace.dependencies until a
# third consumer appears.
tempfile = "3"

[[bin]]
name = "fluxframe-gui"
path = "src/main.rs"

[lints]
workspace = true
