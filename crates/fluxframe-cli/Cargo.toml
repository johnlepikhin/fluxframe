[package]
name = "fluxframe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "fluxframe CLI binary: list, check, run, benchmark."

[[bin]]
name = "fluxframe"
path = "src/main.rs"

[features]
# Forward features from `fluxframe-effects` so the CLI binary
# default-builds the full effect catalogue. Slim builds opt out per
# feature, mirroring the layering in `fluxframe-effects` itself.
default = ["ml", "image-fill"]
ml = ["fluxframe-effects/ml"]
image-fill = ["fluxframe-effects/image-fill"]

[dependencies]
fluxframe-core = { workspace = true }
fluxframe-gst = { workspace = true }
fluxframe-effects = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
ctrlc = { workspace = true }
# Rayon's global thread pool defaults to `available_parallelism()`,
# which on many-core machines saturates every CPU during the parallel
# image-processing passes.  We cap it from `main.rs` to keep cores free
# for the kernel's USB-isoc soft-IRQs — without that, the UVC driver
# silently drops packets under load and emits torn camera frames.
rayon = { workspace = true }

[lints]
workspace = true
