[package]
name = "fluxframe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "fluxframe CLI binary: list, check, run, benchmark."

[[bin]]
name = "fluxframe"
path = "src/main.rs"

[features]
# Forward features from `fluxframe-effects` so the CLI binary
# default-builds the full effect catalogue. Slim builds opt out per
# feature, mirroring the layering in `fluxframe-effects` itself.
#
# `wgpu` and `openvino` must be forwarded explicitly: the workspace
# pulls `fluxframe-effects` with `default-features = false`, so the
# effects crate's own `default = [..., "wgpu", "openvino", ...]` is
# inert from the CLI's perspective. Without these forwards the
# `fluxframe` binary would ship without the GPU blur backend and the
# OpenVINO inference backend despite both being default-on inside the
# effects crate.
default = ["ml", "image-fill", "wgpu", "openvino"]
ml = ["fluxframe-effects/ml"]
image-fill = ["fluxframe-effects/image-fill"]
wgpu = ["fluxframe-effects/wgpu"]
openvino = ["fluxframe-effects/openvino"]

[dependencies]
fluxframe-core = { workspace = true }
fluxframe-gst = { workspace = true }
fluxframe-effects = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
crossbeam-channel = { workspace = true }
ctrlc = { workspace = true }
# Rayon's global thread pool defaults to `available_parallelism()`,
# which on many-core machines saturates every CPU during the parallel
# image-processing passes.  We cap it from `main.rs` to keep cores free
# for the kernel's USB-isoc soft-IRQs — without that, the UVC driver
# silently drops packets under load and emits torn camera frames.
rayon = { workspace = true }
# Stage 15 idle mode: ImagePlaceholder loads a PNG/JPEG once at
# startup and resizes it to the output dimensions. Same crate /
# version as `fluxframe-effects::image_fill`; pulled directly so the
# placeholder path stays cleanly in the CLI layer.
image = { workspace = true }

# Stage 15 idle-mode consumer detector — Linux-only (the rest of the
# `idle::detector` module is already cfg-gated). inotify-driven event
# loop replaces /proc polling for ~zero-syscall steady-state idle.
[target.'cfg(target_os = "linux")'.dependencies]
inotify = { workspace = true }

[dev-dependencies]
# Used by the `control_socket_e2e` integration test to bind a unique
# UNIX socket path per run without colliding with other tests or with
# a real daemon running on the developer's machine.
tempfile = "3"

[lints]
workspace = true
