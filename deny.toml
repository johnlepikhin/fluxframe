# cargo-deny configuration for FluxFrame.
#
# Run with `cargo deny check` (binary: `cargo install cargo-deny`).
# Add to CI / pre-commit once cargo-deny is available in the dev
# environment — until then, the file documents the intent.

[advisories]
# Inherit defaults from cargo-deny — fail on any RUSTSEC advisory in
# the dependency graph that has not been explicitly silenced below.
ignore = []

[licenses]
version = 2
# License allowlist. The workspace itself ships under "MIT OR Apache-2.0"
# (see Cargo.toml [workspace.package].license). Transitive deps are
# expected to be permissive (MIT / Apache / BSD / ISC / Zlib / Unicode).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"  # bitflags 1.3.2 / 2.11.1 is the known case.
wildcards = "deny"
# Crates that should never appear (e.g. openssl when rustls is in use):
deny = []
# Skip the bitflags duplicate explicitly — gtk4-rs / wgpu pin different
# majors and we cannot force-unify without one upstream releasing.
skip = [
    { name = "bitflags", version = "1.3.2" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Empty allow-list is intentional — only crates.io and known git sources
# may pass.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
