[workspace]
resolver = "3"
members = [
    "crates/fluxframe-core",
    "crates/fluxframe-gst",
    "crates/fluxframe-effects",
    "crates/fluxframe-cli",
    "crates/fluxframe-gui",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["FluxFrame contributors"]
repository = "https://github.com/johnlepikhin/fluxframe"
rust-version = "1.85"

[workspace.dependencies]
fluxframe-core = { path = "crates/fluxframe-core", version = "0.6.0" }
fluxframe-gst = { path = "crates/fluxframe-gst", version = "0.6.0" }
fluxframe-effects = { path = "crates/fluxframe-effects", version = "0.6.0", default-features = false }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
# `api-24` feature pins to ONNX Runtime ABI 1.24; required to compile
# against `ort 2.0.0-rc.12` on top of newer OrtApi layouts.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "std", "api-24"] }
rayon = "1"
# Safe wrapper around the V4L2 ioctls.  Pulled in solely so the
# V4L2-loopback output sink can pre-negotiate format via ioctl and
# hand the resulting fd to GStreamer's `fdsink` — the only way to
# bypass `v4l2sink`'s race-prone mmap pool (gst-plugins-good's
# `v4l2sink` for OUTPUT has an unimplemented `io-mode=rw` and only
# offers MMAP, which races against the consumer; see
# <https://github.com/umlaeute/v4l2loopback/issues/191>).
#
# Features are pinned explicitly instead of riding on `v4l`'s defaults.
# `v4l2` selects the `v4l2-sys` backend, which is what re-exports
# `v4l::v4l_sys` — the module `fluxframe-gst::v4l2_events` imports for
# its raw event ioctls.  The alternative `libv4l` backend re-exports a
# different sys crate whose structs have different layouts, and the
# V4L2 ioctl request numbers encode the struct size, so silently
# switching backends would not fail to compile in every case — it would
# issue the wrong ioctl.  `default-features = false` + explicit `v4l2`
# is byte-for-byte equivalent to today's defaults, but pins the choice.
v4l = { version = "0.14", default-features = false, features = ["v4l2"] }
# Safe cross-platform GPU API.  Stage 7 uses it to run the box-blur
# stage on the Intel iGPU via Vulkan compute shaders.  Pinned to the
# minor version because wgpu still ships breaking API changes between
# minors (pre-1.0 semver semantics in practice — the project's own
# release notes call them out explicitly).
wgpu = "29.0"
# Minimal blocking `block_on` for the few `Future`-returning calls in
# `wgpu`'s safe API (adapter / device request).  Tiny zero-dep crate;
# we never invoke a tokio/async-std executor anywhere else in the
# tree, so this stays the entire async story.
pollster = "0.4"
# Intel-maintained Rust bindings for OpenVINO (Stage 8, experimental
# CPU-plugin seam).  `runtime-linking` mirrors `ort`'s `load-dynamic`:
# `libopenvino.so` is dlopened at process start via `LD_LIBRARY_PATH`
# (pip install path documented in README).  `default-features =
# false` excludes the build-time linker discovery that would
# otherwise look for a system-wide OpenVINO install (which Guix does
# not have).
openvino = { version = "0.11", default-features = false, features = ["runtime-linking"] }
# Image decoder for `image_fill` plane effect — loads a static
# background photo from disk once in `prepare()`, resizes to the
# negotiated frame dimensions, then `memcpy`s into the plane on each
# frame. `default-features = false` strips the kitchen-sink format
# support; we only need `jpeg` + `png` for typical corporate brand
# backgrounds.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Stage 15 inotify-driven idle-mode consumer detector. `default-features
# = false` drops the optional `stream` (async/futures) feature — we run
# the detector on a dedicated synchronous thread with a NONBLOCK fd.
inotify = { version = "0.11", default-features = false }
# GStreamer-rs stack shared by fluxframe-gst (capture/output) and
# fluxframe-gui (embedded live preview). Pinned to the same minor
# so the workspace has one ABI version; bump in lockstep.
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
glib = "0.20"
# GTK 4 + libadwaita stack lives in `fluxframe-gui/Cargo.toml` directly
# because the `package = "..."` rename does not interact cleanly with
# `workspace.dependencies` inheritance. Version pins documented there.

[workspace.lints.rust]
# `forbid` (not `deny`) so a stray `#[allow(unsafe_code)]` somewhere in
# the tree cannot quietly re-enable `unsafe`.  The MVP processing path
# is pure safe Rust by design; if a future stage genuinely needs unsafe
# (SIMD intrinsics, FFI helpers beyond the existing GStreamer/ORT
# wrappers) the operator can downgrade this knob deliberately rather
# than having a subtle dependency creep it in.
#
# One deliberate exemption exists: `fluxframe-gst` opts out of these
# workspace lints entirely (it declares its own `[lints]`) because the
# V4L2 event ioctls have no safe wrapper anywhere in the ecosystem.
# That crate is the V4L2 boundary already; the other four keep `forbid`.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
