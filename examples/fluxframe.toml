# FluxFrame example configuration.
#
# Copy to ~/.config/fluxframe/fluxframe.toml and adjust the input mode
# to your camera. Every key is documented in doc/user/configuration.md;
# effects and their parameters in doc/user/presets-and-effects.md.
#
# Relative paths (the model below) are resolved against the directory
# of this file, so keep the models/ directory next to it.

[input]
# "auto" picks the first available camera; use a path such as
# "/dev/video0" to pin a specific one.
device = "auto"
# The daemon picks the camera mode that serves this size and rate best
# (see `v4l2-ctl --list-formats-ext`), using MJPEG when the camera
# reaches the size at full rate only that way. Processing cost grows
# with the frame area; the MediaPipe model always runs at 256x256.
width = 800
height = 448
fps = 30
# Capture at a higher resolution than the effects run at. With
# `auto_frame` the crop is cut from the large capture, so a zoomed-in
# face stays sharp while processing costs what 800x448 costs.
#capture_width = 1280
#capture_height = 720

[output]
# v4l2loopback device created with video_nr=10.
device = "/dev/video10"
# RGB is cheaper than YUY2 and avoids colour banding.
format = "RGB"
scale = 1.0

[realtime]
# 0 = automatic (2 threads).
processing_threads = 0
metrics_interval_secs = 30

[logging]
level = "info"

# Required by fluxframe-gui.
[control]
enabled = true

# Release the camera when no application reads the virtual camera.
[idle]
enabled = true
placeholder = "color"
placeholder_rgb = [16, 16, 16]
teardown_secs = 5

# ---------------------------------------------------------------------------
# Presets. `fluxframe run` uses "default" unless --preset is given.
# ---------------------------------------------------------------------------

# Neutral grey background.
[presets.default.mask]
model = "./models/selfie_segmentation.onnx"
chain = ["smooth_temporal", "threshold", "largest_blob", "feather"]

[presets.default.mask.smooth_temporal]
factor = 0.85

[presets.default.mask.threshold]
level = 0.8

[presets.default.mask.largest_blob]
level = 0.5

[presets.default.mask.feather]
radius = 2

[presets.default.background]
chain = ["color_fill"]

[presets.default.background.color_fill]
rgb = [128, 128, 128]

# Blurred background.
[presets.blur.mask]
model = "./models/selfie_segmentation.onnx"
chain = ["smooth_temporal", "threshold", "largest_blob", "feather"]

[presets.blur.mask.smooth_temporal]
factor = 0.85

[presets.blur.mask.threshold]
level = 0.8

[presets.blur.mask.largest_blob]
level = 0.5

[presets.blur.mask.feather]
radius = 4

[presets.blur.background]
chain = ["blur"]

[presets.blur.background.blur]
radius = 20
passes = 1
downscale = 1

# Work call: blurred and vignetted room, brightened and sharpened speaker.
[presets.work.mask]
model = "./models/selfie_segmentation.onnx"
chain = ["smooth_temporal", "threshold", "largest_blob", "feather"]

[presets.work.mask.smooth_temporal]
factor = 0.85

[presets.work.mask.threshold]
level = 0.8

[presets.work.mask.largest_blob]
level = 0.5

[presets.work.mask.feather]
radius = 4

[presets.work.background]
chain = ["blur", "vignette"]

[presets.work.background.blur]
radius = 20
passes = 1
downscale = 1

[presets.work.background.vignette]
strength = 0.3
inner_radius = 0.5

[presets.work.foreground]
chain = ["exposure_correct", "sharpen"]

[presets.work.foreground.exposure_correct]
target_brightness = 0.55

[presets.work.foreground.sharpen]
amount = 0.3

# Automatic framing around the speaker over a blurred background,
# mirrored so that text behind you reads correctly for the audience.
[presets.framed.mask]
model = "./models/selfie_segmentation.onnx"
chain = ["smooth_temporal", "threshold", "largest_blob", "feather"]

[presets.framed.mask.smooth_temporal]
factor = 0.85

[presets.framed.mask.threshold]
level = 0.8

[presets.framed.mask.largest_blob]
level = 0.5

[presets.framed.mask.feather]
radius = 3

[presets.framed.background]
chain = ["blur"]

[presets.framed.background.blur]
radius = 20

[presets.framed.post]
chain = ["auto_frame", "mirror"]

[presets.framed.post.auto_frame]
threshold = 0.5
padding = 0.15
smoothing = 0.85
zoom_max = 1.3
# The frame follows only after you stay off by 12 % for a second,
# then glides there in 0.8 s.
deadband = 0.12
hold_secs = 1.0
glide_secs = 0.8

# Stained glass: the room becomes fixed irregular cells in its own,
# averaged colours, with thin dark lines between them.
[presets.glass.mask]
model = "./models/selfie_segmentation.onnx"
chain = ["smooth_temporal", "threshold", "largest_blob", "feather"]

[presets.glass.mask.smooth_temporal]
factor = 0.85

[presets.glass.mask.threshold]
level = 0.8

[presets.glass.mask.largest_blob]
level = 0.5

[presets.glass.mask.feather]
radius = 3

[presets.glass.background]
chain = ["stained_glass"]

[presets.glass.background.stained_glass]
cell_size = 48
irregularity = 0.8
# Higher values turn movement behind you into slower colour shifts.
smoothing = 0.9
line_width = 2
line_strength = 0.6

# Spotlight: the room stays sharp but steps back. Colour and light fade
# away from you and you cast a soft shadow on it. All three effects
# follow the mask.
[presets.spotlight.mask]
model = "./models/selfie_segmentation.onnx"
chain = ["smooth_temporal", "threshold", "largest_blob", "feather"]

[presets.spotlight.mask.smooth_temporal]
factor = 0.85

[presets.spotlight.mask.threshold]
level = 0.8

[presets.spotlight.mask.largest_blob]
level = 0.5

[presets.spotlight.mask.feather]
radius = 3

[presets.spotlight.background]
chain = ["color_focus", "halo", "shadow"]

[presets.spotlight.background.color_focus]
radius = 80
fade = 0.7

[presets.spotlight.background.halo]
radius = 60
glow = 0.15
dim = 0.3

[presets.spotlight.background.shadow]
offset_x = 14
offset_y = 8
blur = 12
strength = 0.35

# Robust Video Matting on an Intel NPU: soft hair edges and a steadier
# mask, with the video delayed by one frame. Prepare the model first with
# `tools/prepare-rvm.py --output-dir models` (see doc/user/installation.md),
# then uncomment. Without an NPU the "blur" preset runs instead.
#
# [presets.rvm]
# fallback_preset = "blur"
#
# [presets.rvm.mask]
# model = "./models/rvm_mobilenetv3_d0.4.onnx"
# # No threshold or smooth_temporal: the alpha is soft and already stable.
# chain = ["largest_blob", "feather"]
#
# [presets.rvm.mask.feather]
# # In frame pixels: the RVM mask has the frame size.
# radius = 2
#
# [presets.rvm.background]
# chain = ["blur"]
#
# [presets.rvm.background.blur]
# radius = 20

# Camera image without processing.
[presets.raw]
